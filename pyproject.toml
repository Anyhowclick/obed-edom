[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sermon-slides"
version = "0.1.0"
description = "Generate LW and DSK Keynote decks from sermon/offering Word outlines."
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.1.0",
    "PyYAML>=6.0",
    "Pillow>=10.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "reportlab>=4.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# starlette>=1.6 moved TestClient onto httpx2; without it the dashboard API
# tests fail to import rather than fail an assertion.
test = [
    "pytest>=8.0",
    "httpx2>=0.1",
]

[project.scripts]
sermon-slides = "sermon_slides.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sermon_slides = ["*.yaml", "*.js"]
