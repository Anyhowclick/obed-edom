[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obed-edom"
version = "0.1.0"
description = "Generate LW and DSK Keynote decks from sermon/offering Word outlines."
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.1.0",
    "PyYAML>=6.0",
    "Pillow>=10.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "reportlab>=4.0",
    "pypdf>=5.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    # macOS Vision OCR. Keynote's scripting API cannot read text inside groups
    # or baked into images, so rendered previews are read instead.
    "pyobjc-framework-Vision>=10.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
# starlette>=1.6 moved TestClient onto httpx2; without it the dashboard API
# tests fail to import rather than fail an assertion.
test = [
    "pytest>=8.0",
    "httpx2>=0.1",
]
# Offline IWA decode for per-run character style (inspect item["runs"]). Kept an
# optional extra, not a base dep: keynote-parser advertises support up to Keynote
# 14.5 while shipping decks are 15.x, so decode is best-effort — iwa_runs imports
# it lazily and the inspect path degrades to empty runs when it is absent or a
# deck won't decode. Pins are exact because that forward-compat is the top risk.
iwa = [
    "keynote-parser==1.14.5.0",
    "python-snappy==0.7.3",
    "cramjam==2.11.0",
    "protobuf==7.36.0",
]

[project.scripts]
obed-edom = "obed_edom.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
obed_edom = ["*.yaml", "*.js"]
