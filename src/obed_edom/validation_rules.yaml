# Machine-readable house style. See .cursor/skills/sermon-validation/SKILL.md
trinity_must_be_caps:
  - God
  - Father
  - Son
trinity_associated:
  - My
book_names:
  Psalms: Psalm
  Revelation: Revelations
date_en_dash: true
highlight_punctuation: true
center_wall:
  width: 3840
  height: 1080
quotes:
  living: name_only
  deceased: name_and_lifespan
follow_bible_gateway: true
overflow:
  enabled: true
  # Extra slack before a box is flagged (Keynote leading vs estimate).
  height_slack_px: 8
  char_em: 0.58
  line_height: 1.18

# Severity per rule: off | info | warning | error. Retunes noise without code
# changes. Anything not listed keeps the severity the rule ships with.
rules:
  # LW vs DSK copy
  text.case: warning
  text.symbol: warning
  text.reference: warning
  text.word: warning
  text.major: warning
  # Reference labels sit above the body on one deck and below on the other.
  text.order: info
  # The wall fits more verses than the lower third, so the split differs often.
  text.verse_split: info
  # One side has no readable text at all, usually a preview that failed to OCR.
  text.unreadable: off
  # Magic Move keeps the PRE title on the wall while the verse changes.
  text.point_carry: info

  # Photos
  photo.source: warning
  photo.rotated: warning
  photo.flipped: warning
  photo.count: info
  # Only fires when the copy already matched, so it is the last line of defence
  # for a reshot, flipped or tilted image whose tilt is baked into the file.
  photo.differs: warning
  # Localised edit inside a pasted screenshot (blur patch, redrawn area).
  photo.region: warning
  # Highlight box or circle added, moved or recoloured.
  photo.marker: warning
  # Same picture, framed or cropped differently. Not a content edit.
  photo.framing: info

  # Pairing
  diff.count: info
  diff.missing: warning
  diff.unmatched: info
  diff.skip_mismatch: warning

  # Geometry. Objects fully inside a side panel are intentional on a 7680 wall.
  bounds.straddles: warning
  bounds.offcanvas: warning
  bounds.canvas: off

  # Scripture
  bible.mismatch: error
  bible.wrong_reference: error
  bible.unchecked: info
  bible.relative: warning

  # House style
  style.smallcaps: warning
  style.trinity: warning
  style.book_name: warning
  style.date: warning
  style.highlight: warning
  style.quote: info
  style.glossary: warning
  overflow.text: warning
  ocr.unavailable: info

# Human titles for the dashboard heading "Title · Slide".
titles:
  text.case: Text Case
  text.symbol: Text Symbol
  text.reference: Text Reference
  text.word: Text Word
  text.major: Wording differs.
  text.order: Text Order
  text.verse_split: Text Verse Split
  text.unreadable: Text Unreadable
  text.point_carry: Point Title Carry
  photo.source: Photo Source
  photo.rotated: Photo Rotated
  photo.flipped: Photo Flipped
  photo.count: Photo Count
  photo.differs: Photo Differs
  photo.region: Photo Region
  photo.marker: Photo Marker
  photo.framing: Photo Framing
  diff.count: Diff Count
  diff.missing: Diff Missing
  diff.unmatched: Diff Unmatched
  diff.skip_mismatch: Diff Skip Mismatch
  bounds.straddles: Bounds Straddles
  bounds.offcanvas: Bounds Offcanvas
  bible.mismatch: Bible Mismatch
  bible.wrong_reference: Bible Wrong Reference
  bible.unchecked: Bible Unchecked
  bible.relative: Bible Relative
  style.smallcaps: Style Smallcaps
  style.trinity: Trinity Word Style
  style.book_name: Style Book Name
  style.date: Style Date
  style.highlight: Style Highlight
  style.quote: Style Quote
  style.glossary: House spelling
  overflow.text: Overflow Text
  ocr.unavailable: Ocr Unavailable

# Proper nouns that must be spelled this way. Checked against rendered text, so
# it also catches names baked into images.
glossary:
  - First Love Conference
  - Asia Pentecostal Summit
  - Book of Romans Seminar
  - Great Commandment
  - Great Commission
  - Cultural Mandate
  - Holy Spirit
